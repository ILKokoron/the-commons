name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Contract unit tests
        working-directory: contract-v7
        run: cargo test
      - name: Build the contract wasm
        working-directory: contract-v7
        run: cargo build --release --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP dependency
        run: pip install mcp
      - name: Byte-compile the Python sources
        run: python -m py_compile mcp/server.py mcp/client.py agents/runner.py agents/keeper.py agents/llm_runner.py agents/security_runner.py agents/footprint.py agents/fleet.py agents/watchdog.py scripts/export_dataset.py scripts/reconstruct_footprint.py
      - name: Import the MCP server module
        working-directory: mcp
        run: python -c "import server; print('tools module ok')"
      - name: Amount parser unit tests
        run: python mcp/test_amounts.py
      - name: LLM amount parser unit tests
        run: python agents/test_llm_amount.py
      - name: Security runner unit tests
        run: python agents/test_security_runner.py
