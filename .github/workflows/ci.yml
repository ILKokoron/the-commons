name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Contract unit tests
        working-directory: contract-v6
        run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP dependency
        run: pip install mcp
      - name: Byte-compile the Python sources
        run: python -m py_compile mcp/server.py mcp/client.py agents/runner.py agents/keeper.py agents/llm_runner.py agents/footprint.py
      - name: Import the MCP server module
        working-directory: mcp
        run: python -c "import server; print('tools module ok')"
      - name: Amount parser unit tests
        run: python mcp/test_amounts.py
